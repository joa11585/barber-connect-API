<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia Prates</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom right, #000, #222);
      color: #ffcc00;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #ffcc00;
    }

    button {
      background: #ffcc00;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 15px 40px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      background: #ffdb4d;
    }

    p {
      color: #ccc;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="logo">💈 Barbearia Prates</div>
  <button onclick="entrar()">Entrar no site</button>
  <p>Estilo e elegância em cada detalhe.</p>

  <script>
    function entrar() {
      window.location.href = "index.html"; // redireciona para o site principal
    }
  </script>
</body>
</html>
